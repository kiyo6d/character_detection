<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>文字検出ツール</title>
<style>
  :root { --kb: 0px; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; }
  #video, #still { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  #still { display: none; }
  #overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  .glass { background: rgba(30,30,30,.6); color: #fff;
    -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4); }

  #status { position: absolute; top: calc(env(safe-area-inset-top) + 12px); left: 12px;
    padding: 6px 12px; border-radius: 999px; font-size: 13px; max-width: calc(100% - 110px); }
  #status .dot { display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%;
    background: #ffd600; animation: pulse 1s infinite; vertical-align: middle; }
  #status .dot.hidden { display: none; }
  @keyframes pulse { 50% { opacity: .25; } }

  #tools { position: absolute; top: calc(env(safe-area-inset-top) + 8px); right: 12px; display: flex; gap: 8px; }
  #tools button { width: 40px; height: 40px; border: 0; border-radius: 50%; font-size: 18px; }
  #tools button.on { background: #ffd600; color: #000; }
  #torch { display: none; }

  #panel { position: absolute; top: calc(env(safe-area-inset-top) + 56px); right: 12px; width: min(300px, calc(100% - 24px));
    display: none; padding: 12px; border-radius: 14px; font-size: 14px; }
  #panel label { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 8px 0; }
  #panel select { font-size: 14px; padding: 4px; border-radius: 6px; max-width: 170px; }
  #dbgText { display: none; margin-top: 8px; max-height: 26vh; overflow: auto; white-space: pre-wrap;
    font-size: 11px; line-height: 1.35; background: rgba(0,0,0,.5); padding: 6px; border-radius: 8px; }

  #dock { position: absolute; left: 16px; right: 16px; bottom: calc(var(--kb) + env(safe-area-inset-bottom) + 24px); }
  #controls { display: flex; gap: 10px; justify-content: center; margin-bottom: 10px; }
  #controls button { border: 0; border-radius: 999px; padding: 8px 16px; font-size: 14px; }
  #shutter { display: none; background: #ffd600 !important; color: #000 !important; font-weight: 600; }

  #bar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 14px; }
  #bar svg { flex: none; opacity: .7; }
  #q { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: #fff; font-size: 17px; }
  #q::placeholder { color: rgba(255,255,255,.55); }
  #clear { flex: none; border: 0; background: transparent; color: rgba(255,255,255,.7); font-size: 20px;
    line-height: 1; padding: 0 2px; display: none; }

  #error { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center;
    justify-content: center; gap: 16px; padding: 32px; text-align: center; color: #fff; background: #111; white-space: pre-wrap; }
  #error button { border: 0; border-radius: 10px; padding: 10px 20px; font-size: 16px; }
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="still"></canvas>
  <canvas id="overlay"></canvas>

  <div id="status" class="glass"><span class="dot"></span><span id="statusText">起動中…</span></div>
  <div id="tools">
    <button id="torch" class="glass" aria-label="ライト">🔦</button>
    <button id="gear" class="glass" aria-label="設定">⚙</button>
  </div>

  <div id="panel" class="glass">
    <label>認識方式
      <select id="psm">
        <option value="3">自動(標準)</option>
        <option value="11">散らばった文字</option>
        <option value="6">1ブロック</option>
      </select>
    </label>
    <label>解像度
      <select id="res">
        <option value="960">軽い(960)</option>
        <option value="1280" selected>標準(1280)</option>
        <option value="1920">高(1920)</option>
        <option value="2560">最高(2560)</option>
      </select>
    </label>
    <label>デバッグ表示 <input type="checkbox" id="dbg"></label>
    <div id="dbgText"></div>
  </div>

  <div id="dock">
    <div id="controls">
      <button id="modeBtn" class="glass">モード: ライブ</button>
      <button id="shutter" class="glass">撮影</button>
    </div>
    <div id="bar" class="glass">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" placeholder="検索ワードを入力..." enterkeyhint="search"
             autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button id="clear" aria-label="クリア">✕</button>
    </div>
  </div>

  <div id="error"><div id="errorText"></div><button id="retry">再試行</button></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
'use strict';

/* ================= 設定 ================= */
const CFG = {
  langs: ['jpn', 'eng'],
  thumbSize: 32,
  motionThreshold: 9,
  monitorMs: 200,
  shotMinSide: 2000,     // 撮影モードの最低解像度(長辺)
};

/* ================= 要素 ================= */
const $ = s => document.querySelector(s);
const video = $('#video'), still = $('#still'), overlay = $('#overlay'), octx = overlay.getContext('2d');
const input = $('#q'), clearBtn = $('#clear'), torchBtn = $('#torch'), gearBtn = $('#gear');
const statusText = $('#statusText'), statusDot = $('#status .dot');
const errorBox = $('#error'), errorText = $('#errorText');
const modeBtn = $('#modeBtn'), shutterBtn = $('#shutter');
const panel = $('#panel'), psmSel = $('#psm'), resSel = $('#res'), dbgChk = $('#dbg'), dbgText = $('#dbgText');

/* ================= 状態 ================= */
let worker = null, ready = false, loadingLabel = '', busy = false;
let needOcr = true, moved = false;
let lines = [], matches = [];
let query = '', ocrThumb = null, stream = null, track = null;
let mode = 'live';          // 'live' | 'shot'
let frozen = false;         // 撮影モードで静止画を表示中
let debug = false, maxSide = 1280;

const sleep = ms => new Promise(r => setTimeout(r, ms));
const normQ = s => s.normalize('NFKC').toLowerCase().replace(/\s+/g, '');

/* ================= カメラ ================= */
async function startCamera() {
  errorBox.style.display = 'none';
  if (!navigator.mediaDevices?.getUserMedia) {
    return showError('カメラを使えません。HTTPS(または localhost)で開いてください。');
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false,
    });
  } catch (e) {
    return showError('カメラにアクセスできません。ブラウザのカメラ許可を確認してください。\n(' + e.name + ')');
  }
  video.srcObject = stream;
  await video.play().catch(() => {});
  track = stream.getVideoTracks()[0];
  if (track.getCapabilities?.().torch) torchBtn.style.display = 'block';
  needOcr = true;
  draw();
}
function showError(msg) { errorText.textContent = msg; errorBox.style.display = 'flex'; }
$('#retry').onclick = startCamera;

let torchOn = false;
torchBtn.onclick = async () => {
  try {
    torchOn = !torchOn;
    await track.applyConstraints({ advanced: [{ torch: torchOn }] });
    torchBtn.classList.toggle('on', torchOn);
  } catch { torchOn = false; }
};

/* ================= OCR ================= */
async function initOcr() {
  loadingLabel = 'OCRエンジンを読み込み中';
  refreshStatus();
  try {
    worker = await Tesseract.createWorker(CFG.langs, 1, {
      logger: m => {
        if (ready || typeof m.progress !== 'number') return;
        loadingLabel = `OCRエンジンを読み込み中 ${Math.round(m.progress * 100)}%`;
        refreshStatus();
      },
    });
    await worker.setParameters({ tessedit_pageseg_mode: psmSel.value });
    ready = true; loadingLabel = '';
  } catch (e) {
    console.error(e);
    loadingLabel = 'OCRエンジンの読み込みに失敗(ネット接続を確認)';
  }
  refreshStatus();
}

// カメラ映像を縮小して取り込む(長辺 side px)
const frame = document.createElement('canvas'), fctx = frame.getContext('2d');
function grabFrame(side) {
  const vw = video.videoWidth, vh = video.videoHeight;
  const s = Math.min(1, side / Math.max(vw, vh));
  frame.width = Math.round(vw * s); frame.height = Math.round(vh * s);
  fctx.drawImage(video, 0, 0, frame.width, frame.height);
  return { w: frame.width, h: frame.height };
}

// 白黒化+コントラスト自動補正(影・低コントラストでの認識率向上)
const proc = document.createElement('canvas'), pctx = proc.getContext('2d', { willReadFrequently: true });
function preprocess(src) {
  proc.width = src.width; proc.height = src.height;
  pctx.drawImage(src, 0, 0);
  const img = pctx.getImageData(0, 0, proc.width, proc.height), d = img.data;
  const hist = new Uint32Array(256), n = d.length / 4;
  for (let i = 0; i < d.length; i += 4) {
    const g = (d[i] * 77 + d[i+1] * 150 + d[i+2] * 29) >> 8;
    d[i] = g; hist[g]++;
  }
  let acc = 0, lo = 0, hi = 255;
  for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc >= n * 0.01) { lo = v; break; } }
  acc = 0;
  for (let v = 255; v >= 0; v--) { acc += hist[v]; if (acc >= n * 0.01) { hi = v; break; } }
  const k = hi > lo + 10 ? 255 / (hi - lo) : 1;
  for (let i = 0; i < d.length; i += 4) {
    const g = Math.max(0, Math.min(255, (d[i] - lo) * k));
    d[i] = d[i+1] = d[i+2] = g;
  }
  pctx.putImageData(img, 0, 0);
  return proc;
}

const T = CFG.thumbSize, tcv = document.createElement('canvas');
tcv.width = tcv.height = T;
const tctx = tcv.getContext('2d', { willReadFrequently: true });
function thumb() {
  tctx.drawImage(video, 0, 0, T, T);
  const d = tctx.getImageData(0, 0, T, T).data, g = new Uint8Array(T * T);
  for (let i = 0; i < g.length; i++) g[i] = (d[4*i] * 77 + d[4*i+1] * 150 + d[4*i+2] * 29) >> 8;
  return g;
}
function diff(a, b) { let s = 0; for (let i = 0; i < a.length; i++) s += Math.abs(a[i] - b[i]); return s / a.length; }

// Tesseractの結果 → 行ごとの「空白なし正規化文字列」+「1文字ずつのボックス」(0-1正規化)
function extractLines(data, W, H) {
  let src;
  if (data.blocks) src = data.blocks.flatMap(b => (b.paragraphs || []).flatMap(p => p.lines || []));
  else if (data.lines) src = data.lines;
  else src = (data.words || []).map(w => ({ words: [w] }));
  const out = [];
  for (const ln of src) {
    let text = ''; const map = [], boxes = [];
    const add = (t, b) => {
      const n = (t || '').normalize('NFKC').toLowerCase().replace(/\s+/g, '');
      if (!n || !b) return;
      const id = boxes.push({ x0: b.x0 / W, y0: b.y0 / H, x1: b.x1 / W, y1: b.y1 / H }) - 1;
      for (let k = 0; k < n.length; k++) map.push(id);
      text += n;
    };
    for (const w of ln.words || []) {
      if (w.symbols && w.symbols.length) w.symbols.forEach(s => add(s.text, s.bbox));
      else add(w.text, w.bbox);
    }
    if (text) out.push({ text, map, boxes });
  }
  return out;
}

function findMatches(q) {
  if (!q) return [];
  const res = [];
  for (const ln of lines) {
    let from = 0, i;
    while ((i = ln.text.indexOf(q, from)) !== -1) {
      let x0 = 1, y0 = 1, x1 = 0, y1 = 0; const seen = new Set();
      for (let k = i; k < i + q.length; k++) {
        const id = ln.map[k]; if (seen.has(id)) continue; seen.add(id);
        const b = ln.boxes[id];
        x0 = Math.min(x0, b.x0); y0 = Math.min(y0, b.y0); x1 = Math.max(x1, b.x1); y1 = Math.max(y1, b.y1);
      }
      res.push({ x0, y0, x1, y1 });
      from = i + q.length;
    }
  }
  return res;
}

async function recognizeCurrentFrame(side) {
  const { w, h } = grabFrame(side);
  const img = preprocess(frame);
  const { data } = await worker.recognize(img, {}, { blocks: true });
  return { w, h, data };
}

// ライブ: 1回ずつ順番に実行
async function runLiveOcr() {
  busy = true; refreshStatus();
  try {
    const t = thumb();
    const { w, h, data } = await recognizeCurrentFrame(maxSide);
    lines = extractLines(data, w, h);
    ocrThumb = t; needOcr = false; moved = false;
    afterOcr();
  } catch (e) { console.error(e); await sleep(1000); }
  finally { busy = false; refreshStatus(); }
}

// 撮影: 高解像度で1枚だけ認識。静止画上に枠を出すので時間差・位置ずれがない
async function shoot() {
  if (!ready || busy || !video.videoWidth) return;
  busy = true; lines = []; matches = []; refreshStatus();
  try {
    const side = Math.max(maxSide, CFG.shotMinSide);
    const { w, h } = grabFrame(side);
    still.width = w; still.height = h;
    still.getContext('2d').drawImage(frame, 0, 0);
    still.style.display = 'block'; frozen = true;
    shutterBtn.textContent = '再撮影';
    draw();
    const img = preprocess(frame);
    const { data } = await worker.recognize(img, {}, { blocks: true });
    lines = extractLines(data, w, h);
    afterOcr();
  } catch (e) { console.error(e); }
  finally { busy = false; refreshStatus(); }
}
function unfreeze() {
  frozen = false; still.style.display = 'none';
  shutterBtn.textContent = '撮影';
  lines = []; matches = []; updateDebugText(); draw(); refreshStatus();
}
shutterBtn.onclick = () => { if (frozen) unfreeze(); else shoot(); };

async function ocrLoop() {
  for (;;) {
    await sleep(120);
    if (mode !== 'live' || !ready || busy || document.hidden || !video.videoWidth) continue;
    if (!needOcr) continue;
    if (!query && lines.length) continue;
    await runLiveOcr();
  }
}

setInterval(() => {
  if (mode !== 'live' || document.hidden || !video.videoWidth) return;
  if (!ocrThumb) { needOcr = true; return; }
  const m = diff(thumb(), ocrThumb) > CFG.motionThreshold;
  if (m) needOcr = true;
  if (m !== moved) { moved = m; draw(); }
}, CFG.monitorMs);
document.addEventListener('visibilitychange', () => { if (!document.hidden) needOcr = true; });

/* ================= 描画 ================= */
function afterOcr() { updateDebugText(); rematch(); }
function rematch() { matches = findMatches(query); refreshStatus(); draw(); }

// 映像(または静止画)上の正規化座標 → 画面座標。object-fit: cover と同じ計算
function draw() {
  const dpr = window.devicePixelRatio || 1;
  const cw = overlay.clientWidth, ch = overlay.clientHeight;
  if (overlay.width !== Math.round(cw * dpr) || overlay.height !== Math.round(ch * dpr)) {
    overlay.width = Math.round(cw * dpr); overlay.height = Math.round(ch * dpr);
  }
  octx.setTransform(dpr, 0, 0, dpr, 0, 0);
  octx.clearRect(0, 0, cw, ch);

  const sw = frozen ? still.width : video.videoWidth;
  const sh = frozen ? still.height : video.videoHeight;
  if (!sw || !sh) return;
  const s = Math.max(cw / sw, ch / sh);
  const ox = (cw - sw * s) / 2, oy = (ch - sh * s) / 2;
  const R = r => [r.x0 * sw * s + ox, r.y0 * sh * s + oy, (r.x1 - r.x0) * sw * s, (r.y1 - r.y0) * sh * s];

  if (debug) {                                   // OCRが認識した全文字の枠(水色)
    octx.lineWidth = 1; octx.strokeStyle = 'rgba(0,220,255,.8)';
    for (const ln of lines) for (const b of ln.boxes) octx.strokeRect(...R(b));
  }
  if (!matches.length) return;
  const pad = 3;
  octx.globalAlpha = (!frozen && moved) ? 0.35 : 1;
  octx.lineWidth = 3; octx.strokeStyle = '#ffd600'; octx.fillStyle = 'rgba(255,214,0,.25)';
  for (const r of matches) {
    const [x, y, w, h] = R(r);
    octx.fillRect(x - pad, y - pad, w + pad * 2, h + pad * 2);
    octx.strokeRect(x - pad, y - pad, w + pad * 2, h + pad * 2);
  }
  octx.globalAlpha = 1;
}
window.addEventListener('resize', draw);
video.addEventListener('loadedmetadata', draw);

/* ================= UI ================= */
function refreshStatus() {
  let text, dot = false;
  if (!ready) { text = loadingLabel || '起動中…'; dot = !loadingLabel.includes('失敗'); }
  else if (mode === 'shot' && !frozen && !busy) text = '「撮影」で文字を読み取ります';
  else if (busy) { text = '解析中…'; dot = true; }
  else if (!query) text = 'キーワードを入力してください';
  else text = matches.length ? `${matches.length}件ヒット` : '見つかりません';
  statusText.textContent = text;
  statusDot.classList.toggle('hidden', !dot);
}

function updateDebugText() {
  dbgText.style.display = debug ? 'block' : 'none';
  if (!debug) return;
  dbgText.textContent = lines.length
    ? `認識結果(${lines.length}行)\n` + lines.map(l => l.text).join('\n')
    : '認識結果なし';
}

function setMode(m) {
  mode = m;
  if (m === 'live') unfreeze();
  modeBtn.textContent = 'モード: ' + (m === 'live' ? 'ライブ' : '撮影');
  shutterBtn.style.display = m === 'shot' ? 'inline-block' : 'none';
  needOcr = true; refreshStatus();
}
modeBtn.onclick = () => setMode(mode === 'live' ? 'shot' : 'live');

gearBtn.onclick = () => {
  const open = panel.style.display !== 'block';
  panel.style.display = open ? 'block' : 'none';
  gearBtn.classList.toggle('on', open);
};
psmSel.onchange = async () => {
  if (worker) await worker.setParameters({ tessedit_pageseg_mode: psmSel.value });
  needOcr = true;
};
resSel.onchange = () => { maxSide = +resSel.value; needOcr = true; };
dbgChk.onchange = () => { debug = dbgChk.checked; updateDebugText(); draw(); };

input.addEventListener('input', () => {
  query = normQ(input.value);
  clearBtn.style.display = input.value ? 'block' : 'none';
  rematch();
});
input.addEventListener('keydown', e => { if (e.key === 'Enter') input.blur(); });
clearBtn.onclick = () => { input.value = ''; input.dispatchEvent(new Event('input')); };
$('#stage').addEventListener('click', e => {
  if (!e.target.closest('#dock') && !e.target.closest('#panel') && !e.target.closest('#tools')) input.blur();
});

if (window.visualViewport) {
  const vv = window.visualViewport;
  const fit = () => document.documentElement.style.setProperty(
    '--kb', Math.max(0, window.innerHeight - vv.height - vv.offsetTop) + 'px');
  vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit);
}

/* ================= 起動 ================= */
startCamera();
initOcr();
ocrLoop();
refreshStatus();
</script>
</body>
</html>
