<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>文字検出ツール</title>
<style>
  :root { --kb: 0px; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; }
  #video, #still { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  #still { display: none; }
  #overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  .glass { background: rgba(30,30,30,.6); color: #fff;
    -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4); }

  #status { position: absolute; top: calc(env(safe-area-inset-top) + 12px); left: 12px;
    padding: 6px 12px; border-radius: 999px; font-size: 13px; max-width: calc(100% - 110px); }
  #status .dot { display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%;
    background: #ffd600; animation: pulse 1s infinite; vertical-align: middle; }
  #status .dot.hidden { display: none; }
  @keyframes pulse { 50% { opacity: .25; } }

  #tools { position: absolute; top: calc(env(safe-area-inset-top) + 8px); right: 12px; display: flex; gap: 8px; }
  #tools button { width: 40px; height: 40px; border: 0; border-radius: 50%; font-size: 18px; }
  #tools button.on { background: #ffd600; color: #000; }
  #torch { display: none; }

  #panel { position: absolute; top: calc(env(safe-area-inset-top) + 56px); right: 12px; width: min(320px, calc(100% - 24px));
    display: none; padding: 12px; border-radius: 14px; font-size: 14px; max-height: 70vh; overflow: auto; }
  #panel label { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 8px 0; }
  #panel select { font-size: 14px; padding: 4px; border-radius: 6px; max-width: 190px; }
  #panel .hint { font-size: 11px; opacity: .65; margin: -2px 0 6px; }
  #dbgText { display: none; margin-top: 8px; max-height: 26vh; overflow: auto; white-space: pre-wrap;
    font-size: 11px; line-height: 1.35; background: rgba(0,0,0,.5); padding: 6px; border-radius: 8px; }

  #dock { position: absolute; left: 16px; right: 16px; bottom: calc(var(--kb) + env(safe-area-inset-bottom) + 24px); }
  #controls { display: flex; gap: 10px; justify-content: center; margin-bottom: 10px; }
  #controls button { border: 0; border-radius: 999px; padding: 8px 16px; font-size: 14px; }
  #shutter { display: none; background: #ffd600 !important; color: #000 !important; font-weight: 600; }

  #bar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 14px; }
  #bar svg { flex: none; opacity: .7; }
  #q { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: #fff; font-size: 17px; }
  #q::placeholder { color: rgba(255,255,255,.55); }
  #clear { flex: none; border: 0; background: transparent; color: rgba(255,255,255,.7); font-size: 20px;
    line-height: 1; padding: 0 2px; display: none; }

  #error { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center;
    justify-content: center; gap: 16px; padding: 32px; text-align: center; color: #fff; background: #111; white-space: pre-wrap; }
  #error button { border: 0; border-radius: 10px; padding: 10px 20px; font-size: 16px; }
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="still"></canvas>
  <canvas id="overlay"></canvas>

  <div id="status" class="glass"><span class="dot"></span><span id="statusText">起動中…</span></div>
  <div id="tools">
    <button id="torch" class="glass" aria-label="ライト">🔦</button>
    <button id="gear" class="glass" aria-label="設定">⚙</button>
  </div>

  <div id="panel" class="glass">
    <label>言語
      <select id="lang">
        <option value="jpn+eng">日本語+英語</option>
        <option value="jpn">日本語のみ(速い)</option>
        <option value="eng">英語のみ(最速)</option>
      </select>
    </label>
    <label>並列数
      <select id="pool">
        <option value="1">1(省メモリ)</option>
        <option value="2">2</option>
        <option value="3">3(高性能端末向け)</option>
      </select>
    </label>
    <div class="hint">言語・並列数を変えるとページが再読み込みされます</div>
    <label>認識方式
      <select id="psm">
        <option value="3">自動(標準)</option>
        <option value="11">散らばった文字</option>
        <option value="6">1ブロック</option>
      </select>
    </label>
    <label>解像度
      <select id="res">
        <option value="800">最軽量(800)</option>
        <option value="960">軽い(960)</option>
        <option value="1280">標準(1280)</option>
        <option value="1920">高(1920)</option>
        <option value="2560">最高(2560)</option>
      </select>
    </label>
    <label>デバッグ表示 <input type="checkbox" id="dbg"></label>
    <div id="dbgText"></div>
  </div>

  <div id="dock">
    <div id="controls">
      <button id="modeBtn" class="glass">モード: ライブ</button>
      <button id="shutter" class="glass">撮影</button>
    </div>
    <div id="bar" class="glass">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" placeholder="検索ワードを入力..." enterkeyhint="search"
             autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button id="clear" aria-label="クリア">✕</button>
    </div>
  </div>

  <div id="error"><div id="errorText"></div><button id="retry">再試行</button></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
'use strict';

/* ================= 設定 ================= */
const CFG = {
  motionThreshold: 9,    // 前回OCRした画面からこれ以上変わったら再OCR(輝度差の平均, 0-255)
  shotMinSide: 2000,     // 撮影モードの最低解像度(長辺)
  trackW: 160,           // 動き追従用の画像の幅
  trackRange: 4,         // 1フレームで追従できる最大移動量(追従用画像のpx)
  trackLostErr: 25,      // 追従の信頼度がこれを超えたら「見失い」扱い
};

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

/* ================= 要素 ================= */
const $ = s => document.querySelector(s);
const video = $('#video'), still = $('#still'), overlay = $('#overlay'), octx = overlay.getContext('2d');
const input = $('#q'), clearBtn = $('#clear'), torchBtn = $('#torch'), gearBtn = $('#gear');
const statusText = $('#statusText'), statusDot = $('#status .dot');
const errorBox = $('#error'), errorText = $('#errorText');
const modeBtn = $('#modeBtn'), shutterBtn = $('#shutter');
const panel = $('#panel'), psmSel = $('#psm'), resSel = $('#res'), dbgChk = $('#dbg');
const langSel = $('#lang'), poolSel = $('#pool'), dbgText = $('#dbgText');

/* ================= 状態 ================= */
const defaultPool = (navigator.hardwareConcurrency || 4) >= 6 ? 2 : 1;
const settings = {
  lang: store.get('lang', 'jpn+eng'),
  pool: +store.get('pool', defaultPool),
  psm: store.get('psm', '3'),
  res: +store.get('res', 1280),
  debug: store.get('debug', '0') === '1',
};
langSel.value = settings.lang; poolSel.value = settings.pool; psmSel.value = settings.psm;
resSel.value = settings.res; dbgChk.checked = settings.debug;

let pool = [];                 // [{w: Tesseractワーカー, busy: bool}]
let ready = false, loadingLabel = '', shooting = false;
let needOcr = true;
let lines = [], matches = [];  // 直近OCR結果 / キーワード一致の矩形(0-1正規化)
let disp = { sx: 0, sy: 0 };   // 表示中のOCR結果を、現在の映像位置へ動かすための移動量(0-1正規化)
let query = '', stream = null, track = null;
let mode = 'live', frozen = false;
let debug = settings.debug, maxSide = settings.res;

const sleep = ms => new Promise(r => setTimeout(r, ms));
const normQ = s => s.normalize('NFKC').toLowerCase().replace(/\s+/g, '');
const isBusy = () => shooting || pool.some(p => p.busy);

/* ================= カメラ ================= */
async function startCamera() {
  errorBox.style.display = 'none';
  if (!navigator.mediaDevices?.getUserMedia) {
    return showError('カメラを使えません。HTTPS(または localhost)で開いてください。');
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false,
    });
  } catch (e) {
    return showError('カメラにアクセスできません。ブラウザのカメラ許可を確認してください。\n(' + e.name + ')');
  }
  video.srcObject = stream;
  await video.play().catch(() => {});
  track = stream.getVideoTracks()[0];
  if (track.getCapabilities?.().torch) torchBtn.style.display = 'block';
  needOcr = true;
  draw();
}
function showError(msg) { errorText.textContent = msg; errorBox.style.display = 'flex'; }
$('#retry').onclick = startCamera;

let torchOn = false;
torchBtn.onclick = async () => {
  try {
    torchOn = !torchOn;
    await track.applyConstraints({ advanced: [{ torch: torchOn }] });
    torchBtn.classList.toggle('on', torchOn);
  } catch { torchOn = false; }
};

/* ================= OCR ================= */
async function initOcr() {
  loadingLabel = 'OCRエンジンを読み込み中';
  refreshStatus();
  try {
    const langs = settings.lang.split('+');
    const workers = await Promise.all(Array.from({ length: settings.pool }, () =>
      Tesseract.createWorker(langs, 1, {
        logger: m => {
          if (ready || typeof m.progress !== 'number') return;
          loadingLabel = `OCRエンジンを読み込み中 ${Math.round(m.progress * 100)}%`;
          refreshStatus();
        },
      })));
    await Promise.all(workers.map(w => w.setParameters({ tessedit_pageseg_mode: settings.psm })));
    pool = workers.map(w => ({ w, busy: false }));
    ready = true; loadingLabel = '';
  } catch (e) {
    console.error(e);
    loadingLabel = 'OCRエンジンの読み込みに失敗(ネット接続を確認)';
  }
  refreshStatus();
}

// 映像を縮小して「新しいcanvas」に取り込む(並列ジョブ同士で干渉しない)
function captureFrame(side) {
  const vw = video.videoWidth, vh = video.videoHeight;
  const s = Math.min(1, side / Math.max(vw, vh));
  const c = document.createElement('canvas');
  c.width = Math.round(vw * s); c.height = Math.round(vh * s);
  c.getContext('2d').drawImage(video, 0, 0, c.width, c.height);
  return c;
}

// 白黒化+コントラスト自動補正(その場で書き換え)
function preprocess(c) {
  const ctx = c.getContext('2d', { willReadFrequently: true });
  const img = ctx.getImageData(0, 0, c.width, c.height), d = img.data;
  const hist = new Uint32Array(256), n = d.length / 4;
  for (let i = 0; i < d.length; i += 4) {
    const g = (d[i] * 77 + d[i+1] * 150 + d[i+2] * 29) >> 8;
    d[i] = g; hist[g]++;
  }
  let acc = 0, lo = 0, hi = 255;
  for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc >= n * 0.01) { lo = v; break; } }
  acc = 0;
  for (let v = 255; v >= 0; v--) { acc += hist[v]; if (acc >= n * 0.01) { hi = v; break; } }
  const k = hi > lo + 10 ? 255 / (hi - lo) : 1;
  for (let i = 0; i < d.length; i += 4) {
    const g = Math.max(0, Math.min(255, (d[i] - lo) * k));
    d[i] = d[i+1] = d[i+2] = g;
  }
  ctx.putImageData(img, 0, 0);
  return c;
}

// Tesseractの結果 → 行ごとの「空白なし正規化文字列」+「1文字ずつのボックス」(0-1正規化)
function extractLines(data, W, H) {
  let src;
  if (data.blocks) src = data.blocks.flatMap(b => (b.paragraphs || []).flatMap(p => p.lines || []));
  else if (data.lines) src = data.lines;
  else src = (data.words || []).map(w => ({ words: [w] }));
  const out = [];
  for (const ln of src) {
    let text = ''; const map = [], boxes = [];
    const add = (t, b) => {
      const n = (t || '').normalize('NFKC').toLowerCase().replace(/\s+/g, '');
      if (!n || !b) return;
      const id = boxes.push({ x0: b.x0 / W, y0: b.y0 / H, x1: b.x1 / W, y1: b.y1 / H }) - 1;
      for (let k = 0; k < n.length; k++) map.push(id);
      text += n;
    };
    for (const w of ln.words || []) {
      if (w.symbols && w.symbols.length) w.symbols.forEach(s => add(s.text, s.bbox));
      else add(w.text, w.bbox);
    }
    if (text) out.push({ text, map, boxes });
  }
  return out;
}

function findMatches(q) {
  if (!q) return [];
  const res = [];
  for (const ln of lines) {
    let from = 0, i;
    while ((i = ln.text.indexOf(q, from)) !== -1) {
      let x0 = 1, y0 = 1, x1 = 0, y1 = 0; const seen = new Set();
      for (let k = i; k < i + q.length; k++) {
        const id = ln.map[k]; if (seen.has(id)) continue; seen.add(id);
        const b = ln.boxes[id];
        x0 = Math.min(x0, b.x0); y0 = Math.min(y0, b.y0); x1 = Math.max(x1, b.x1); y1 = Math.max(y1, b.y1);
      }
      res.push({ x0, y0, x1, y1 });
      from = i + q.length;
    }
  }
  return res;
}

/* ================= 動きの追従(OCRの待ち時間を隠す) =================
   小さな白黒画像で「前フレームから画面がどれだけ平行移動したか」を毎フレーム推定し、
   枠を同じだけ動かす。OCR開始時点からの移動量をジョブごとに積算しておき、
   結果が返ってきた時点で「撮影時の位置→現在の位置」へ補正する。 */
const TW = CFG.trackW; let TH = 90;
const tcv = document.createElement('canvas');
const tctx = tcv.getContext('2d', { willReadFrequently: true });
let prevG = null, latestG = null, ocrRefG = null, trackLost = false;
const jobs = new Set();

function grabG() {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw) return null;
  const h = Math.max(24, Math.round(TW * vh / vw));
  if (tcv.width !== TW || tcv.height !== h) { tcv.width = TW; tcv.height = h; TH = h; prevG = null; ocrRefG = null; }
  tctx.drawImage(video, 0, 0, TW, TH);
  const d = tctx.getImageData(0, 0, TW, TH).data, g = new Uint8Array(TW * TH);
  for (let i = 0; i < g.length; i++) g[i] = (d[4*i] * 77 + d[4*i+1] * 150 + d[4*i+2] * 29) >> 8;
  return g;
}
function diffG(a, b) { let s = 0; for (let i = 0; i < a.length; i++) s += Math.abs(a[i] - b[i]); return s / a.length; }

// cur(x,y) ≒ prev(x-dx, y-dy) となる (dx,dy) をブロックマッチングで探す(サブピクセル補間つき)
function estimateShift(prev, cur) {
  const R = CFG.trackRange, m = R + 1, N = 2 * R + 1;
  const sad = new Float64Array(N * N);
  let best = Infinity, bi = 0, cnt = 1;
  for (let j = 0; j < N; j++) {
    const dy = j - R;
    for (let i = 0; i < N; i++) {
      const dx = i - R; let s = 0, c = 0;
      for (let y = m; y < TH - m; y += 2) {
        const rc = y * TW, rp = (y - dy) * TW - dx;
        for (let x = m; x < TW - m; x += 2) {
          const a = cur[rc + x] - prev[rp + x];
          s += a < 0 ? -a : a; c++;
        }
      }
      sad[j * N + i] = s; cnt = c;
      if (s < best) { best = s; bi = j * N + i; }
    }
  }
  const bx = bi % N, by = (bi / N) | 0;
  let dx = bx - R, dy = by - R;
  const edge = bx === 0 || bx === N - 1 || by === 0 || by === N - 1;
  if (!edge) {
    const s0 = sad[bi], l = sad[bi - 1], r = sad[bi + 1], u = sad[bi - N], d = sad[bi + N];
    const dnx = l - 2 * s0 + r, dny = u - 2 * s0 + d;
    if (dnx > 0) dx += 0.5 * (l - r) / dnx;
    if (dny > 0) dy += 0.5 * (u - d) / dny;
  }
  return { dx, dy, lost: edge || best / cnt > CFG.trackLostErr };
}

let lastTick = 0;
function tick(ts) {
  requestAnimationFrame(tick);
  if (mode !== 'live' || frozen || document.hidden || !video.videoWidth || ts - lastTick < 33) return;
  lastTick = ts;
  const cur = grabG(); if (!cur) return;
  latestG = cur;
  let redraw = false;
  if (prevG && prevG.length === cur.length) {
    const e = estimateShift(prevG, cur);
    if (e.lost !== trackLost) { trackLost = e.lost; redraw = true; }
    if (!e.lost) {
      let { dx, dy } = e;
      if (Math.abs(dx) < 0.2) dx = 0;
      if (Math.abs(dy) < 0.2) dy = 0;
      if (dx || dy) {
        const nx = dx / TW, ny = dy / TH;
        disp.sx += nx; disp.sy += ny;
        for (const j of jobs) { j.sx += nx; j.sy += ny; }
        redraw = true;
      }
    }
  }
  prevG = cur;
  if (!ocrRefG || ocrRefG.length !== cur.length || diffG(cur, ocrRefG) > CFG.motionThreshold) needOcr = true;
  if (redraw) draw();
}
requestAnimationFrame(tick);

/* ================= ライト: 並列パイプライン ================= */
function startJob(slot) {
  slot.busy = true; needOcr = false;
  ocrRefG = latestG || grabG();
  const job = { id: ++seq, sx: 0, sy: 0 };
  jobs.add(job);
  const cv = captureFrame(maxSide), W = cv.width, H = cv.height;
  preprocess(cv);
  slot.w.recognize(cv, {}, { blocks: true })
    .then(({ data }) => {
      if (mode !== 'live' || frozen || job.id <= appliedSeq) return;   // 古い結果は捨てる
      appliedSeq = job.id;
      lines = extractLines(data, W, H);
      disp = { sx: job.sx, sy: job.sy };                               // 撮影時→現在位置へ補正
      afterOcr();
    })
    .catch(e => console.error(e))
    .finally(() => { jobs.delete(job); slot.busy = false; refreshStatus(); });
  refreshStatus();
}
let seq = 0, appliedSeq = 0;

async function dispatchLoop() {
  for (;;) {
    await sleep(30);
    if (mode !== 'live' || !ready || shooting || document.hidden || !video.videoWidth) continue;
    if (!needOcr) continue;
    if (!query && lines.length) continue;           // キーワード未入力ならOCRしない(省電力)
    const slot = pool.find(p => !p.busy);
    if (!slot) continue;
    startJob(slot);
  }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) { needOcr = true; prevG = null; } });

/* ================= 撮影モード ================= */
async function acquire() {
  for (;;) {
    const slot = pool.find(p => !p.busy);
    if (slot) { slot.busy = true; return slot; }
    await sleep(30);
  }
}
async function shoot() {
  if (!ready || shooting || !video.videoWidth) return;
  shooting = true; lines = []; matches = []; refreshStatus();
  let slot;
  try {
    const cv = captureFrame(Math.max(maxSide, CFG.shotMinSide));
    still.width = cv.width; still.height = cv.height;
    still.getContext('2d').drawImage(cv, 0, 0);
    still.style.display = 'block'; frozen = true; disp = { sx: 0, sy: 0 };
    shutterBtn.textContent = '再撮影';
    draw();
    preprocess(cv);
    slot = await acquire();
    const { data } = await slot.w.recognize(cv, {}, { blocks: true });
    if (frozen) { lines = extractLines(data, cv.width, cv.height); afterOcr(); }
  } catch (e) { console.error(e); }
  finally { if (slot) slot.busy = false; shooting = false; refreshStatus(); }
}
function unfreeze() {
  frozen = false; still.style.display = 'none';
  shutterBtn.textContent = '撮影';
  lines = []; matches = []; disp = { sx: 0, sy: 0 }; ocrRefG = null; prevG = null; needOcr = true;
  updateDebugText(); draw(); refreshStatus();
}
shutterBtn.onclick = () => { if (frozen) unfreeze(); else shoot(); };

/* ================= 描画 ================= */
function afterOcr() { updateDebugText(); rematch(); }
function rematch() { matches = findMatches(query); refreshStatus(); draw(); }

// 正規化座標 → 画面座標(object-fit: cover と同じ計算)。ライト中は追従の移動量を加える
function draw() {
  const dpr = window.devicePixelRatio || 1;
  const cw = overlay.clientWidth, ch = overlay.clientHeight;
  if (overlay.width !== Math.round(cw * dpr) || overlay.height !== Math.round(ch * dpr)) {
    overlay.width = Math.round(cw * dpr); overlay.height = Math.round(ch * dpr);
  }
  octx.setTransform(dpr, 0, 0, dpr, 0, 0);
  octx.clearRect(0, 0, cw, ch);

  const sw = frozen ? still.width : video.videoWidth;
  const sh = frozen ? still.height : video.videoHeight;
  if (!sw || !sh) return;
  const s = Math.max(cw / sw, ch / sh);
  const ox = (cw - sw * s) / 2, oy = (ch - sh * s) / 2;
  const mx = frozen ? 0 : disp.sx, my = frozen ? 0 : disp.sy;
  const R = r => [(r.x0 + mx) * sw * s + ox, (r.y0 + my) * sh * s + oy, (r.x1 - r.x0) * sw * s, (r.y1 - r.y0) * sh * s];

  if (debug) {
    octx.lineWidth = 1; octx.strokeStyle = 'rgba(0,220,255,.8)';
    for (const ln of lines) for (const b of ln.boxes) octx.strokeRect(...R(b));
  }
  if (!matches.length) return;
  const pad = 3;
  octx.globalAlpha = (!frozen && trackLost) ? 0.35 : 1;      // 追従を見失っている間は薄く
  octx.lineWidth = 3; octx.strokeStyle = '#ffd600'; octx.fillStyle = 'rgba(255,214,0,.25)';
  for (const r of matches) {
    const [x, y, w, h] = R(r);
    octx.fillRect(x - pad, y - pad, w + pad * 2, h + pad * 2);
    octx.strokeRect(x - pad, y - pad, w + pad * 2, h + pad * 2);
  }
  octx.globalAlpha = 1;
}
window.addEventListener('resize', draw);
video.addEventListener('loadedmetadata', draw);

/* ================= UI ================= */
function refreshStatus() {
  let text, dot = false;
  if (!ready) { text = loadingLabel || '起動中…'; dot = !loadingLabel.includes('失敗'); }
  else if (mode === 'shot' && !frozen && !isBusy()) text = '「撮影」で文字を読み取ります';
  else if (mode === 'shot' && isBusy()) { text = '解析中…'; dot = true; }
  else if (!query) text = 'キーワードを入力してください';
  else { text = matches.length ? `${matches.length}件ヒット` : '見つかりません'; dot = isBusy(); }
  statusText.textContent = text;
  statusDot.classList.toggle('hidden', !dot);
}

function updateDebugText() {
  dbgText.style.display = debug ? 'block' : 'none';
  if (!debug) return;
  dbgText.textContent = lines.length
    ? `認識結果(${lines.length}行)\n` + lines.map(l => l.text).join('\n')
    : '認識結果なし';
}

function setMode(m) {
  mode = m;
  unfreeze();
  modeBtn.textContent = 'モード: ' + (m === 'live' ? 'ライブ' : '撮影');
  shutterBtn.style.display = m === 'shot' ? 'inline-block' : 'none';
  refreshStatus();
}
modeBtn.onclick = () => setMode(mode === 'live' ? 'shot' : 'live');

gearBtn.onclick = () => {
  const open = panel.style.display !== 'block';
  panel.style.display = open ? 'block' : 'none';
  gearBtn.classList.toggle('on', open);
};
langSel.onchange = () => { store.set('lang', langSel.value); location.reload(); };
poolSel.onchange = () => { store.set('pool', poolSel.value); location.reload(); };
psmSel.onchange = async () => {
  store.set('psm', psmSel.value);
  await Promise.all(pool.map(p => p.w.setParameters({ tessedit_pageseg_mode: psmSel.value })));
  needOcr = true;
};
resSel.onchange = () => { maxSide = +resSel.value; store.set('res', maxSide); needOcr = true; };
dbgChk.onchange = () => { debug = dbgChk.checked; store.set('debug', debug ? '1' : '0'); updateDebugText(); draw(); };

input.addEventListener('input', () => {
  query = normQ(input.value);
  clearBtn.style.display = input.value ? 'block' : 'none';
  rematch();                                   // キャッシュ済みOCR結果から即座に再検索
});
input.addEventListener('keydown', e => { if (e.key === 'Enter') input.blur(); });
clearBtn.onclick = () => { input.value = ''; input.dispatchEvent(new Event('input')); };
$('#stage').addEventListener('click', e => {
  if (!e.target.closest('#dock') && !e.target.closest('#panel') && !e.target.closest('#tools')) input.blur();
});

if (window.visualViewport) {
  const vv = window.visualViewport;
  const fit = () => document.documentElement.style.setProperty(
    '--kb', Math.max(0, window.innerHeight - vv.height - vv.offsetTop) + 'px');
  vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit);
}

/* ================= 起動 ================= */
startCamera();
initOcr();
dispatchLoop();
updateDebugText();
refreshStatus();
</script>
</body>
</html>
